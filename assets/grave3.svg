<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 38 285 100" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .ink   { fill: #4a6a85; }
      .stone { fill: #3a5470; }
      .earth { fill: #6d8298; }
      .word  { font-size: 96px; font-weight: 400; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- "gr_ve" -->
  <text x="40" y="115" class="ink word">gr</text>
  <text x="210" y="115" class="ink word">ve</text>

  <!-- Tombstone -->
  <g transform="translate(135,40)">
    <path class="stone"
          d="M5,75 L5,30 A30,30 0 0 1 65,30 L65,75 Z"/>
  </g>

  <!-- Mound: flush along stone base, tapered points just past each edge -->
  <path class="earth" d="M132,115 L208,115 Q170,132 132,115 Z"/>
</svg>