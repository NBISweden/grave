<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">

  <!-- Present-day dashed line -->
  <line x1="700" y1="28" x2="700" y2="445" stroke="#646667" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="700" y="18" text-anchor="middle" fill="#070707" font-size="18" font-weight="600" letter-spacing="1">Present day</text>

  <!-- ============ PHYLOGENETIC TREE ============ -->
  <g stroke="#2d3436" stroke-width="2.5" stroke-linecap="round" fill="none">

    <!-- Root stem -->
    <line x1="70" y1="152" x2="120" y2="152"/>

    <!-- Root split: Outgroup (y60) ↔ Ingroup ancestor (y244) -->
    <line x1="120" y1="60"  x2="120" y2="244"/>
    <!-- Outgroup → present -->
    <line x1="120" y1="60"  x2="700" y2="60"/>
    <!-- → Node ABCDE -->
    <line x1="120" y1="244" x2="200" y2="244"/>

    <!-- Node ABCDE split: AB (y165) ↔ CDE (y323) -->
    <line x1="200" y1="165" x2="200" y2="323"/>
    <line x1="200" y1="165" x2="300" y2="165"/>
    <line x1="200" y1="323" x2="280" y2="323"/>

    <!-- Node AB split: A (y130) ↔ B (y200) -->
    <line x1="300" y1="130" x2="300" y2="200"/>
    <!-- Taxon A → present -->
    <line x1="300" y1="130" x2="500" y2="130"/>
    <!-- Taxon B → present -->
    <line x1="300" y1="200" x2="450" y2="200"/>

    <!-- Node CDE split: C (y270) ↔ DE (y375) -->
    <line x1="280" y1="270" x2="280" y2="375"/>
    <!-- Taxon C → present -->
    <line x1="280" y1="270" x2="700" y2="270"/>
    <!-- → Node DE -->
    <line x1="280" y1="375" x2="370" y2="375"/>

    <!-- Node DE split: D (y340) ↔ E (y410) -->
    <line x1="370" y1="340" x2="370" y2="410"/>
    <!-- Taxon D → present -->
    <line x1="370" y1="340" x2="700" y2="340"/>
    <!-- Taxon E → present -->
    <line x1="370" y1="410" x2="700" y2="410"/>
  </g>

  <!-- ============ EXTANT TERMINALS ============ -->
  <circle cx="700" cy="60"  r="5" fill="#00b894"/>
  <circle cx="700" cy="270" r="5" fill="#00b894"/>
  <circle cx="700" cy="340" r="5" fill="#00b894"/>
  <circle cx="700" cy="410" r="5" fill="#00b894"/>

  <!-- ============ EXTINCT TERMINALS (× marks) ============ -->
  <g stroke="#d63031" stroke-width="2.5" stroke-linecap="round">
    <line x1="494" y1="124" x2="506" y2="136"/><line x1="506" y1="124" x2="494" y2="136"/>
    <line x1="444" y1="194" x2="456" y2="206"/><line x1="456" y1="194" x2="444" y2="206"/>
  </g>

  <!-- ============ LABELS ============ -->
  <text x="714" y="64"  fill="#070707" font-size="16" font-weight="600">Outgroup</text>

<!-- Ingroup bracket -->
  <line x1="724" y1="130" x2="724" y2="410" stroke="#070707" stroke-width="2"/>
  <line x1="724" y1="130" x2="720" y2="130" stroke="#070707" stroke-width="2"/>
  <line x1="724" y1="410" x2="720" y2="410" stroke="#070707" stroke-width="2"/>
  <text x="732" y="250" fill="#070707" font-size="16" font-weight="500" dominant-baseline="middle">Study</text>
  <text x="732" y="270" fill="#070707" font-size="16" font-weight="500" dominant-baseline="middle">species</text>

  <!-- ============ TIME AXIS ============ -->
  <line x1="60" y1="455" x2="695" y2="455" stroke="#070707" stroke-width="3" stroke-linecap="round"/>
  <polygon points="700,455 690,450 690,460" fill="#070707"/>
  <text x="390" y="482" text-anchor="middle" fill="#070707" font-size="16" font-weight="500">Time</text>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(570,482)">
    <circle cx="0" cy="-3" r="4" fill="#00b894"/>
    <text x="9" y="1" fill="#070707" font-size="15">Extant</text>
    <g transform="translate(70,0)">
      <line x1="-4" y1="-7" x2="4" y2="1" stroke="#d63031" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="-7" x2="-4" y2="1" stroke="#d63031" stroke-width="2" stroke-linecap="round"/>
      <text x="9" y="1" fill="#070707" font-size="15">Extinct</text>
    </g>
  </g>

</svg>