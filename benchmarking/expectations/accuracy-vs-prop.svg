<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="sans-serif" font-size="12">
  <!-- Title -->
  <text x="310" y="22" text-anchor="middle" font-size="15" font-weight="bold">
    Mapping accuracy vs. reads retained, by read length and k+w
  </text>

  <!-- Plot area -->
  <rect x="70" y="50" width="420" height="350" fill="none" stroke="#333"/>

  <!-- Axes ticks/labels: X = % reads retained (40-100) -->
  <g stroke="#333">
    <line x1="70" y1="400" x2="70" y2="405"/><line x1="140" y1="400" x2="140" y2="405"/>
    <line x1="210" y1="400" x2="210" y2="405"/><line x1="280" y1="400" x2="280" y2="405"/>
    <line x1="350" y1="400" x2="350" y2="405"/><line x1="420" y1="400" x2="420" y2="405"/>
    <line x1="490" y1="400" x2="490" y2="405"/>
  </g>
  <g text-anchor="middle">
    <text x="70" y="418">40</text><text x="140" y="418">50</text>
    <text x="210" y="418">60</text><text x="280" y="418">70</text>
    <text x="350" y="418">80</text><text x="420" y="418">90</text>
    <text x="490" y="418">100</text>
  </g>
  <text x="280" y="442" text-anchor="middle" font-weight="bold">% reads retained</text>

  <!-- Y axis: accuracy 80-100 -->
  <g stroke="#333">
    <line x1="65" y1="400" x2="70" y2="400"/><line x1="65" y1="330" x2="70" y2="330"/>
    <line x1="65" y1="260" x2="70" y2="260"/><line x1="65" y1="190" x2="70" y2="190"/>
    <line x1="65" y1="120" x2="70" y2="120"/><line x1="65" y1="50" x2="70" y2="50"/>
  </g>
  <g text-anchor="end">
    <text x="60" y="404">80</text><text x="60" y="334">84</text>
    <text x="60" y="264">88</text><text x="60" y="194">92</text>
    <text x="60" y="124">96</text><text x="60" y="54">100</text>
  </g>
  <text x="20" y="225" text-anchor="middle" font-weight="bold"
        transform="rotate(-90 20 225)">mapping accuracy (%)</text>

  <!-- Five read lengths × two k+w (solid = k+w setting A, dashed = B) -->
  <!-- Each polyline: low MAPQ (right, lower acc) -> high MAPQ (left, higher acc) -->

  <!-- 30 bp (red) -->
  <polyline points="475,260 430,210 360,170 270,150 170,150" fill="none" stroke="#d73027" stroke-width="2"/>
  <polyline points="470,300 410,260 330,225 240,210 140,215" fill="none" stroke="#d73027" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- 40 bp (orange) -->
  <polyline points="478,200 440,160 380,125 300,110 210,108" fill="none" stroke="#fc8d59" stroke-width="2"/>
  <polyline points="473,240 420,205 360,175 280,160 190,162" fill="none" stroke="#fc8d59" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- 50 bp (yellow-green) -->
  <polyline points="480,150 450,115 400,90 330,80 250,78" fill="none" stroke="#91cf60" stroke-width="2"/>
  <polyline points="476,185 435,155 390,130 320,120 240,122" fill="none" stroke="#91cf60" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- 60 bp (teal) -->
  <polyline points="482,110 455,85 415,70 360,62 290,60" fill="none" stroke="#1a9850" stroke-width="2"/>
  <polyline points="478,140 445,115 405,95 350,85 280,85" fill="none" stroke="#1a9850" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- 70 bp (blue) -->
  <polyline points="485,85 460,68 425,58 380,52 320,50" fill="none" stroke="#4575b4" stroke-width="2"/>
  <polyline points="481,108 450,90 415,78 370,72 310,72" fill="none" stroke="#4575b4" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Points at each MAPQ on the 50bp solid line, labelled -->
  <g fill="#91cf60" stroke="#333">
    <circle cx="480" cy="150" r="4"/>
    <circle cx="450" cy="115" r="4"/>
    <circle cx="400" cy="90" r="4"/>
    <circle cx="330" cy="80" r="4"/>
    <circle cx="250" cy="78" r="4"/>
  </g>
  <g font-size="10" fill="#333">
    <text x="488" y="153">Q0</text>
    <text x="455" y="108">Q10</text>
    <text x="405" y="83">Q20</text>
    <text x="335" y="73">Q30</text>
    <text x="255" y="71">Q60</text>
  </g>

  <!-- Legend: read lengths -->
  <g transform="translate(510,60)" font-size="11">
    <text x="0" y="0" font-weight="bold">Read length</text>
    <line x1="0" y1="14" x2="20" y2="14" stroke="#d73027" stroke-width="2"/><text x="25" y="18">30</text>
    <line x1="0" y1="32" x2="20" y2="32" stroke="#fc8d59" stroke-width="2"/><text x="25" y="36">40</text>
    <line x1="0" y1="50" x2="20" y2="50" stroke="#91cf60" stroke-width="2"/><text x="25" y="54">50</text>
    <line x1="0" y1="68" x2="20" y2="68" stroke="#1a9850" stroke-width="2"/><text x="25" y="72">60</text>
    <line x1="0" y1="86" x2="20" y2="86" stroke="#4575b4" stroke-width="2"/><text x="25" y="90">70</text>

    <text x="0" y="115" font-weight="bold">k+w</text>
    <line x1="0" y1="129" x2="20" y2="129" stroke="#333" stroke-width="2"/><text x="25" y="133">A</text>
    <line x1="0" y1="147" x2="20" y2="147" stroke="#333" stroke-width="2" stroke-dasharray="5,4"/><text x="25" y="151">B</text>
  </g>

  <!-- Arrow showing MAPQ direction -->
  <g font-size="10" fill="#666">
    <text x="280" y="395" text-anchor="middle">← increasing MAPQ filter</text>
  </g>
</svg>