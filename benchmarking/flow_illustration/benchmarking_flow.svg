<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 430"
     width="1150" height="430" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <filter id="softBlur" x="-12%" y="-15%" width="124%" height="130%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1150" height="430" fill="white"/>

  <!-- ── BENCHMARKING BACKGROUND (soft-edge, no hard border) ── -->
  <rect x="656" y="140" width="458" height="262" rx="30"
        fill="#c8e6c9" fill-opacity="0.95" filter="url(#softBlur)"/>
  <text x="885" y="166" text-anchor="middle" font-size="18"
        fill="#2e7d32" font-style="italic" font-weight="bold">
    Benchmarking specific steps
  </text>

  <!-- ── INPUT BOX (feeds in from above) ── -->
  <rect x="35" y="34" width="162" height="92" rx="10"
        fill="#e67e22" stroke="#ca6f1e" stroke-width="1.5"/>
  <text x="116" y="62"  text-anchor="middle" font-size="16"
        fill="white" font-weight="bold">100k reads per</text>
  <text x="116" y="80"  text-anchor="middle" font-size="16"
        fill="white" font-weight="bold">read length</text>
  <text x="116" y="101" text-anchor="middle" font-size="14"
        fill="white" font-style="italic">(assembly not in graph)</text>

  <!-- Arrow: input → alignment -->
  <line x1="116" y1="126" x2="116" y2="177"
        stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- MAIN PIPELINE BOXES                                   -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Box 1: Alignment -->
  <rect x="35" y="179" width="162" height="68" rx="8"
        fill="#2980b9" stroke="#1f6391" stroke-width="1.5"/>
  <text x="116" y="218" text-anchor="middle" font-size="14"
        fill="white" font-weight="bold">Alignment to graph</text>

  <!-- → -->
  <line x1="197" y1="213" x2="251" y2="213"
        stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: MAPQ filtering -->
  <rect x="252" y="179" width="162" height="68" rx="8"
        fill="#2980b9" stroke="#1f6391" stroke-width="1.5"/>
  <text x="333" y="207" text-anchor="middle" font-size="14"
        fill="white" font-weight="bold">MAPQ</text>
  <text x="333" y="226" text-anchor="middle" font-size="14"
        fill="white" font-weight="bold">filtering</text>

  <!-- → -->
  <line x1="414" y1="213" x2="468" y2="213"
        stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: Surjection -->
  <rect x="469" y="179" width="162" height="68" rx="8"
        fill="#2980b9" stroke="#1f6391" stroke-width="1.5"/>
  <text x="550" y="207" text-anchor="middle" font-size="14"
        fill="white" font-weight="bold">Surjection to</text>
  <text x="550" y="226" text-anchor="middle" font-size="14"
        fill="white" font-weight="bold">reference genome</text>

  <!-- → -->
  <line x1="631" y1="213" x2="685" y2="213"
        stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 4: Liftover (benchmarking zone) -->
  <rect x="686" y="179" width="162" height="68" rx="8"
        fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="767" y="207" text-anchor="middle" font-size="14"
        fill="white" font-weight="bold">Liftover to</text>
  <text x="767" y="226" text-anchor="middle" font-size="14"
        fill="white" font-weight="bold">original coordinates</text>

  <!-- → -->
  <line x1="848" y1="213" x2="903" y2="213"
        stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 5: Accuracy (benchmarking zone) -->
  <rect x="904" y="179" width="162" height="68" rx="8"
        fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="985" y="207" text-anchor="middle" font-size="14"
        fill="white" font-weight="bold">Accuracy</text>
  <text x="985" y="226" text-anchor="middle" font-size="14"
        fill="white" font-weight="bold">calculation</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LOSS / OUTPUT BOXES (reads filtered out at each step) -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Reads not aligned (below Box 1) -->
  <line x1="116" y1="247" x2="116" y2="318"
        stroke="#e74c3c" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <rect x="35" y="319" width="162" height="62" rx="8"
        fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="116" y="347" text-anchor="middle" font-size="13" fill="#922b21">Reads not</text>
  <text x="116" y="366" text-anchor="middle" font-size="13" fill="#922b21">aligned</text>

  <!-- Reads not passing MAPQ (below Box 2) -->
  <line x1="333" y1="247" x2="333" y2="318"
        stroke="#e74c3c" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <rect x="252" y="319" width="162" height="62" rx="8"
        fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="333" y="347" text-anchor="middle" font-size="13" fill="#922b21">Reads not</text>
  <text x="333" y="366" text-anchor="middle" font-size="13" fill="#922b21">passing MAPQ</text>

  <!-- Reads not surjected (below Box 3) -->
  <line x1="550" y1="247" x2="550" y2="318"
        stroke="#e74c3c" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <rect x="469" y="319" width="162" height="62" rx="8"
        fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="550" y="347" text-anchor="middle" font-size="13" fill="#922b21">Reads not</text>
  <text x="550" y="366" text-anchor="middle" font-size="13" fill="#922b21">surjected</text>

  <!-- Reads not lifted (below Box 4, inside benchmarking zone) -->
  <line x1="767" y1="247" x2="767" y2="318"
        stroke="#e74c3c" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <rect x="686" y="319" width="162" height="62" rx="8"
        fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="767" y="347" text-anchor="middle" font-size="13" fill="#922b21">Reads not</text>
  <text x="767" y="366" text-anchor="middle" font-size="13" fill="#922b21">lifted</text>

</svg>