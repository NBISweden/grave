[project]
authors = ["CormacKinsella <27350062+CormacKinsella@users.noreply.github.com>"]
channels = ["conda-forge", "bioconda"]
description = "Pixi environment for Grave: Graph Variant Explorer (Nextflow workflow for mapping and genotyping against graphs)"
name = "grave"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
grave-dardel-default = {cmd = "nextflow main.nf -profile dardelLocal"}
grave-dardel-default_with-paths = {cmd = "nextflow main.nf --refPaths -profile dardelLocal"}

[dependencies]
nextflow="24.10.0"
apptainer="1.3.6"
