[project]
authors = ["CormacKinsella <27350062+CormacKinsella@users.noreply.github.com>"]
channels = ["conda-forge", "bioconda"]
description = "Grave pixi environments"
name = "grave"
platforms = ["linux-64"]
version = "1.1.0"

[system-requirements]
linux="3.10"
libc="2.17"

[tasks]
help = { cmd = "nextflow main.nf --help" }
dag = { cmd = "nextflow main.nf --graphDir ./data/test -preview -with-dag flowchart.png" }
grave = { cmd = "nextflow main.nf -profile apptainer" }
test = { cmd = "nextflow main.nf --graphDir ./data/test --samplesheet ./data/test/samplesheet.csv --pathsDir ./data/test/paths -profile apptainer,standard" }
testMulti = { cmd = "nextflow main.nf --graphDir ./data/test --samplesheet ./data/test/samplesheet.csv --pathsDir ./data/test/paths --multiRef -profile apptainer,standard" }
testMapOnly = { cmd = "nextflow main.nf --graphDir ./data/test --samplesheet ./data/test/samplesheet.csv --pathsDir ./data/test/paths --graphDeconstruct false --vgGenotype false --freeBayes false --deepVariant false --profilePMD false -profile apptainer,standard" }
filter = { cmd = "nextflow main.nf --graphDir ./data/test --samplesheet ./data/test/samplesheet.csv --pathsDir ./data/test/paths --graphMode filter -profile apptainer,standard" }

[dependencies]
nextflow="==25.04.6"
graphviz=">=12.2.1"
msmtp-sendmail=">=1.8.28"
vg="==1.67.0"

[feature.apptainer.dependencies]
apptainer="==1.4.1"

[environments]
apptainer = ["apptainer"]
