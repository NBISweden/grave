[project]
authors = ["CormacKinsella <27350062+CormacKinsella@users.noreply.github.com>"]
channels = ["conda-forge", "bioconda"]
description = "Grave pixi environment"
name = "grave"
platforms = ["linux-64"]
version = "0.1.8"

[system-requirements]
linux="3.10"
libc="2.17"

[tasks]
help = { cmd = "nextflow main.nf --help" }
dag = { cmd = "nextflow main.nf -preview -with-dag flowchart.png" }
grave = { cmd = "nextflow main.nf" }
grave-test = { cmd = "nextflow main.nf --graphDir ./data/test --samplesheet ./data/test/samplesheet.csv --pathsDir ./data/test/paths" }

[dependencies]
nextflow="==24.10.4"
apptainer="==1.3.6"
graphviz=">=12.2.1"
msmtp-sendmail=">=1.8.28"
vg="==1.63.1"
