[project]
authors = ["CormacKinsella <27350062+CormacKinsella@users.noreply.github.com>"]
channels = ["conda-forge", "bioconda"]
description = "Grave pixi environments"
name = "grave"
platforms = ["linux-64"]
version = "1.0.0"

[system-requirements]
linux="3.10"
libc="2.17"

[tasks]
help = { cmd = "nextflow main.nf --help" }
dag = { cmd = "nextflow main.nf -preview -with-dag flowchart.png" }
grave = { cmd = "nextflow main.nf" }
grave-test = { cmd = "nextflow main.nf --graphDir ./data/test --samplesheet ./data/test/samplesheet.csv --pathsDir ./data/test/paths --dupCalcAccuracy 3 -profile standard" }
grave-filter = { cmd = "nextflow main.nf --graphDir ./data/test --samplesheet ./data/test/samplesheet.csv --pathsDir ./data/test/paths --dupCalcAccuracy 3 --graphMode filter -profile standard" }

[dependencies]
nextflow="==24.10.4"
graphviz=">=12.2.1"
msmtp-sendmail=">=1.8.28"
vg="==1.63.1"

[feature.apptainer.dependencies]
apptainer="==1.3.6"

[environments]
apptainer = ["apptainer"]
